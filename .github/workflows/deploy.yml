name: Deploy Frontend to AWS EC2 (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build Docker Image & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout latest code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Build Docker image on the GitHub runner,
      #    injecting all VITE_* env vars as build args from GitHub Secrets
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
            --build-arg VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }} \
            -t atria-frontend:latest \
            .

      # 3. Save the image as a tar archive
      - name: Save Docker Image as Tar
        run: docker save atria-frontend:latest | gzip > atria-frontend.tar.gz

      # 4. Upload the image tarball to EC2 via SCP
      - name: Upload Image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "atria-frontend.tar.gz,docker-compose.yml"
          target: "~/atria-frontend"

      # 5. SSH into EC2: load image, restart container via docker-compose
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/atria-frontend

            echo "==> Loading Docker image..."
            docker load < atria-frontend.tar.gz

            echo "==> Stopping existing container..."
            docker compose down || true

            echo "==> Starting container..."
            docker compose up -d

            echo "==> Waiting 5s for container to stabilise..."
            sleep 5

            echo "==> Verifying container is running..."
            if [ "$(docker inspect -f '{{.State.Running}}' atria-frontend 2>/dev/null)" != "true" ]; then
              echo "ERROR: Container failed to start! Logs:"
              docker logs atria-frontend --tail 50
              exit 1
            fi

            echo "==> Container status:"
            docker ps | grep atria-frontend

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete!"
